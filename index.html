<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Trip</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Our Trip">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141D" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<style>
@font-face{font-family:"Bricolage";src:url(fonts/bricolage.woff2) format("woff2");font-weight:200 800;font-display:swap}
:root{--bg:#F3F5F8;--card:#fff;--ink:#172033;--mute:#5D697D;--line:#DBE0E8;--soft:#E9EDF2;--legc:#5B6577;--warn:#B45309;--warnbg:#FFF4DE;--ok:#1B7F5A;
 --disp:"Bricolage",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 --leg:var(--legc);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0F141D;--card:#182030;--ink:#EEF1F6;--mute:#9BA6B9;--line:#2A3447;--soft:#202A3B;--warn:#F5B453;--warnbg:#3A2A0E;--ok:#5FD3A6;
 --leg:color-mix(in srgb,var(--legc) 62%,white)}}
[style*="--legc"]{--leg:var(--legc)}
@media (prefers-color-scheme:dark){[style*="--legc"]{--leg:color-mix(in srgb,var(--legc) 62%,white)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
svg.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
:focus-visible{outline:3px solid var(--leg);outline-offset:2px;border-radius:6px}
#app{min-height:100%;padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 84px);max-width:560px;margin:0 auto}
.hide{display:none!important}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(var(--sab) + 4px);display:flex;justify-content:center}
nav.tabs div{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--mute);border-radius:10px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current=page]{color:var(--leg)}

/* shared */
.title{font:800 34px/1.02 var(--disp);letter-spacing:-.02em}
.sub{color:var(--mute);font-size:15px;margin-top:4px}
.h2{font:700 20px/1.2 var(--disp);letter-spacing:-.01em;margin:28px 0 10px}
.card{background:var(--card);border-radius:18px;padding:16px;border:1px solid var(--line)}
.card + .card{margin-top:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.mute{color:var(--mute)}
.small{font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:600;min-height:38px}
.chip.pri{background:var(--leg);color:#fff}
@media (prefers-color-scheme:dark){.chip.pri{color:#0F141D}}
.chip.ghost{background:none;border:1px solid var(--line)}
.warn{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:flex-start}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--mute);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warnp{background:var(--warnbg);color:var(--warn)}
.legbar{width:5px;border-radius:3px;background:var(--leg);align-self:stretch;flex:none}

/* today */
.hero{position:relative;border-radius:26px;padding:20px 18px 14px;color:#fff;background:var(--legc);overflow:hidden}
.hero .daycount{font-size:14px;font-weight:600;opacity:.9;padding-right:104px}
.hero .place{font:800 40px/1 var(--disp);letter-spacing:-.025em;margin-top:6px}
.hero .theme{font-size:16px;margin-top:6px;opacity:.95}
.hero .clock{position:absolute;top:18px;right:18px;text-align:right}
.hero .clock b{display:block;font:700 22px/1 var(--disp);font-variant-numeric:tabular-nums}
.hero .clock span{font-size:12px;opacity:.85}
.sunarc{display:block;width:100%;height:auto;margin-top:6px}
.sunrow{display:flex;justify-content:space-between;font-size:13px;margin-top:-4px}
.sunrow b{display:block;font:700 18px/1.1 var(--disp);font-variant-numeric:tabular-nums}
.sunrow .mid{text-align:center;align-self:flex-end;opacity:.95;font-weight:600}
.sunrow div:last-child{text-align:right}
.next .when{font:700 15px/1 var(--body);color:var(--leg)}
.next h3{font:700 22px/1.15 var(--disp);margin-top:6px}
.next p{margin-top:6px;color:var(--mute)}
.count{font:800 84px/0.9 var(--disp);letter-spacing:-.04em}

/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:62px 18px 1fr;column-gap:8px;position:relative;padding-bottom:16px}
.tl li:last-child{padding-bottom:2px}
.tl .t{font-size:13.5px;font-weight:700;text-align:right;padding-top:1px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tl .t.none{color:var(--mute);font-weight:500}
.tl .rail{position:relative}
.tl .rail::before{content:"";position:absolute;left:8px;top:6px;bottom:-22px;width:2px;background:var(--line)}
.tl li:last-child .rail::before{display:none}
.tl .dot{position:absolute;left:3px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2.5px solid var(--leg)}
.tl li.flight .dot{background:var(--leg)}
.tl li.done{opacity:.5}
.tl li.now .dot{box-shadow:0 0 0 5px color-mix(in srgb,var(--leg) 25%,transparent);background:var(--leg)}
.tl h4{margin:0;font-size:16px;font-weight:650;line-height:1.3}
.tl p{font-size:14.5px;color:var(--mute);margin-top:2px}
.tl .chips{margin-top:8px}
.tl .chip{padding:6px 11px;min-height:34px;font-size:13.5px}
.tl li.warned p{color:var(--warn)}

/* days */
.day{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:10px;overflow:hidden}
.day > button{display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px 12px 12px}
.date{width:50px;flex:none;text-align:center;border-radius:13px;padding:7px 0;background:var(--leg);color:#fff}
@media (prefers-color-scheme:dark){.date{color:#0F141D}}
.date b{display:block;font:800 22px/1 var(--disp)}
.date span{font-size:11.5px;font-weight:700}
.day .place{font:700 17px/1.2 var(--disp)}
.day .theme{font-size:14px;color:var(--mute)}
.day .sunline{font-size:12.5px;color:var(--mute);margin-top:3px;font-variant-numeric:tabular-nums}
.day .chev{transition:transform .2s;color:var(--mute)}
.day.open .chev{transform:rotate(90deg)}
.day .body{display:none;padding:6px 14px 16px 6px;border-top:1px solid var(--line)}
.day.open .body{display:block;padding-top:16px}
.day.today{border-color:var(--leg);box-shadow:0 0 0 1px var(--leg)}

/* travel */
.bp{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:10px;overflow:hidden}
.bp .top{padding:14px 16px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.bp .ap{font:800 30px/1 var(--disp);letter-spacing:-.02em}
.bp .ap + span{display:block;font-size:13px;color:var(--mute);margin-top:3px}
.bp .tm{font-weight:700;font-size:15px;margin-top:6px;font-variant-numeric:tabular-nums}
.bp .to{text-align:right}
.bp .mid{color:var(--leg);text-align:center;font-size:12px;font-weight:700}
.bp .mid svg{width:26px;height:26px;display:block;margin:0 auto 2px}
.bp .bot{border-top:1.5px dashed var(--line);padding:10px 16px 14px;font-size:14px}
.kv{display:flex;flex-wrap:wrap;gap:6px 18px}
.kv div span{display:block;font-size:12px;color:var(--mute)}
.kv div b{font-weight:650}
.datehead{font:700 14px/1 var(--body);color:var(--mute);margin:22px 2px 0}

/* places */
.seg{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:9px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:650;white-space:nowrap;min-height:40px}
.seg button[aria-pressed=true]{background:var(--leg);border-color:var(--leg);color:#fff}
@media (prefers-color-scheme:dark){.seg button[aria-pressed=true]{color:#0F141D}}
ul.plain{margin:0;padding:0;list-style:none}
ul.plain li{padding:9px 0;border-top:1px solid var(--line);font-size:15px}
ul.plain li:first-child{border-top:0;padding-top:0}
ul.plain li:last-child{padding-bottom:0}
.spot{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%}
.spot svg{color:var(--leg)}
table.words{width:100%;border-collapse:collapse;font-size:15px}
table.words td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top}
table.words tr:first-child td{border-top:0;padding-top:0}
table.words td:first-child{color:var(--mute);width:42%;padding-right:10px}
table.words i{display:block;font-size:13px;color:var(--mute)}

/* bookings */
.bk{padding:14px 0;border-top:1px solid var(--line)}
.bk:first-child{border-top:0;padding-top:0}
.bk:last-child{padding-bottom:0}
.bk h4{margin:0;font-size:16px;font-weight:650}
.bk.flash{animation:flash 1.6s}
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--leg) 14%,transparent)}100%{background:none}}
.ref{font:650 14px ui-monospace,Menlo,monospace;letter-spacing:.02em}

/* overlays */
.sheet{position:fixed;inset:0;z-index:50;background:#fff;color:#111;display:flex;flex-direction:column}
.sheet header{padding:calc(var(--sat) + 12px) 16px 10px;display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid #e3e3e3}
.sheet header h2{font:700 19px/1.2 var(--disp)}
.sheet header p{font-size:13.5px;color:#555;margin-top:2px}
.sheet .x{margin-left:auto;background:#111;color:#fff;border-radius:999px;padding:9px 16px;font-weight:700;font-size:15px}
.pages{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.pages section{flex:0 0 100%;scroll-snap-align:center;overflow:auto;padding:10px;text-align:center}
.pages img{width:100%;height:auto;display:block;margin:0 auto;max-width:640px}
.pages section.zoom img{width:230%;max-width:none}
.pages .cap{font-weight:700;font-size:15px;padding:4px 0 10px}
.sheet footer{padding:8px 16px calc(var(--sab) + 10px);text-align:center;font-size:13px;color:#555;border-top:1px solid #e3e3e3}
.taxi{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px;gap:6px;overflow:auto}
.taxi .ask{font-size:18px;color:#555}
.taxi .l1{font:800 40px/1.05 var(--disp);letter-spacing:-.02em;margin-top:8px}
.taxi .l2{font:700 29px/1.15 var(--disp)}
.taxi .ar{font-size:30px;line-height:1.5;margin-top:16px;direction:rtl;text-align:right}
.taxi .chips{margin-top:26px}
.taxi .chip{background:#eee;color:#111}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 96px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:650;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}

/* lock */
#lock{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--sat) + 24px) 28px calc(var(--sab) + 24px);text-align:center;gap:6px}
#lock img{width:148px;height:148px;border-radius:34px;box-shadow:0 14px 40px rgba(23,32,51,.25)}
#lock h1{font:800 34px/1.05 var(--disp);letter-spacing:-.02em;margin-top:22px}
#lock form{margin-top:22px;width:100%;max-width:300px}
#lock input{width:100%;font:700 26px var(--disp);letter-spacing:.3em;text-align:center;padding:14px 10px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);-webkit-text-security:disc}
#lock button{margin-top:12px;width:100%;padding:15px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:700;font-size:17px;text-align:center}
#lock .err{color:var(--warn);font-weight:600;min-height:1.4em;margin-top:10px;font-size:14.5px}
#lock .inst{margin-top:18px;font-size:14px;color:var(--mute);max-width:300px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.500C5 14.900 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></symbol>
<symbol id="i-ticket" viewBox="0 0 24 24"><path d="M3 9V6h18v3a3 3 0 0 0 0 6v3H3v-3a3 3 0 0 0 0-6z"/><path d="M14 6v12" stroke-dasharray="2 2.500"/></symbol>
<symbol id="i-phone" viewBox="0 0 24 24"><path d="M6 3h3l2 5-2.500 1.500a11 11 0 0 0 6 6L16 13l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 4 5a2 2 0 0 1 2-2z"/></symbol>
<symbol id="i-plane" viewBox="0 0 24 24"><path d="M21 3 10.500 13.500M21 3l-6.500 18-4-7.500L3 9.500 21 3z"/></symbol>

<symbol id="i-link" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M11 6H6a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-5"/></symbol>
<symbol id="t-today" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.600 5.600 7 7M17 17l1.400 1.400M5.600 18.400 7 17M17 7l1.400-1.400"/></symbol>

<symbol id="t-travel" viewBox="0 0 24 24"><path d="M21 3 10.500 13.500M21 3l-6.500 18-4-7.500L3 9.500 21 3z"/></symbol>
<symbol id="t-places" viewBox="0 0 24 24"><path d="M12 21s7-6.100 7-11.500A7 7 0 0 0 5 9.500C5 14.900 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></symbol>
<symbol id="t-bookings" viewBox="0 0 24 24"><path d="M3 9V6h18v3a3 3 0 0 0 0 6v3H3v-3a3 3 0 0 0 0-6z"/><path d="M14 6v12" stroke-dasharray="2 2.500"/></symbol>
</defs></svg>

<div id="lock" class="hide">
  <img src="icons/icon-512.png" alt="">
  <h1>Sahara to Madrid</h1>
  <p class="mute">Enter the trip PIN to open</p>
  <form id="pinform" autocomplete="off">
    <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="12" aria-label="Trip PIN" placeholder="PIN" autocomplete="off">
    <button type="submit">Unlock</button>
    <p class="err" id="pinerr" role="alert"></p>
  </form>
  <p class="inst hide" id="inst">To install: tap the Share button in Safari, then “Add to Home Screen”. Open it from the Home Screen and enter the PIN there.</p>
</div>
<main id="app" class="hide"></main>
<nav class="tabs hide" id="tabs" aria-label="Sections"><div></div></nav>
<div id="overlay"></div>
<div id="toast" role="status"></div>

<script>
"use strict";
const CFG = {"salt": "2DO0Pzg6nkP3HhNXwTGsJA==", "iter": 600000, "v": "14e7b9a2a8"};
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const ic = n => `<svg class="i" aria-hidden="true"><use href="#${n}"/></svg>`;
const b64 = {dec: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)), enc: u => btoa(String.fromCharCode(...u))};
let KEY = null, D = null, tab = 'today', place = null, openDays = new Set(), tick = null;

/* ---------- crypto ---------- */
async function derive(pin) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', salt: b64.dec(CFG.salt), iterations: CFG.iter, hash: 'SHA-256'}, km, 256));
}
async function decrypt(buf, key) {
  const k = await crypto.subtle.importKey('raw', key, 'AES-GCM', false, ['decrypt']);
  const u = new Uint8Array(buf);
  return crypto.subtle.decrypt({name: 'AES-GCM', iv: u.slice(0, 12)}, k, u.slice(12));
}
async function loadData(key) {
  const r = await fetch('data.enc?v=' + CFG.v);
  if (!r.ok) throw new Error('net');
  return JSON.parse(new TextDecoder().decode(await decrypt(await r.arrayBuffer(), key)));
}
const imgCache = {};
async function ticketImg(name) {
  if (!imgCache[name]) {
    const r = await fetch('t/' + name + '.enc?v=' + CFG.v);
    imgCache[name] = URL.createObjectURL(new Blob([await decrypt(await r.arrayBuffer(), KEY)], {type: 'image/jpeg'}));
  }
  return imgCache[name];
}

/* ---------- time ---------- */
const H = 3600e3;
const nowMs = () => { const q = new URLSearchParams(location.search).get('now'); return q ? Date.parse(q) : Date.now(); };
const dayStart = d => Date.UTC(D.trip.year, D.trip.month - 1, d.d) - d.off * H;
const itemMs = (d, it) => { if (!it.t) return null; const [h, m] = it.t.split(':').map(Number); return Date.UTC(D.trip.year, D.trip.month - 1, d.d, h, m) - (it.clockOff ?? d.off) * H; };
const hm = t => { if (!t) return ''; let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${String(m).padStart(2, '0')} ${ap}`; };
const hmShort = t => hm(t).replace(' ', ' ');
function todayIdx(n) {
  const days = D.days; if (n < dayStart(days[0])) return -1;
  const end = Date.UTC(D.trip.year, D.trip.month - 1, D.trip.last + 1, 6);
  if (n >= end) return days.length;
  let i = 0; days.forEach((d, k) => { if (n >= dayStart(d)) i = k; }); return i;
}
function curOff(d, n) { let o = d.off; d.items.forEach(it => { if (it.clockOff != null && it.t && n >= itemMs(d, it)) o = it.clockOff; }); return o; }
const CLOCKNAME = {'-6': 'Iowa time', '-5': 'Atlanta time', '0': 'Morocco time', '1': null};
function clockAt(n, off) { const x = new Date(n + off * H); return hm(`${x.getUTCHours()}:${x.getUTCMinutes()}`); }
function rel(ms) { const m = Math.round(ms / 60000); if (m < 1) return 'now'; if (m < 60) return `in ${m} min`; const h = Math.floor(m / 60), r = m % 60; if (h < 24) return `in ${h} hr${r ? ' ' + r + ' min' : ''}`; const dd = Math.round(h / 24); return `in ${dd} day${dd > 1 ? 's' : ''}`; }
const legColor = leg => D.legs[leg].color;
const mapUrl = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
const dirUrl = q => 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(q);

/* ---------- pieces ---------- */
function itemChips(it) {
  let h = '';

function sunArc(d, n) {

  const offOf = name => (D.clocks.find(c => name.includes(c.place)) || {off: name.includes('Marrakech') || name.includes('Merzouga') || name.includes('Errachidia') ? 0 : d.off}).off;
  const r = toMs(d.sun.rise, offOf(d.sun.riseAt)), s = toMs(d.sun.set, offOf(d.sun.setAt));

   ${up ? `<path d="M18 96 Q160 -42 302 96" fill="none" stroke="#fff" stroke-width="2.500" pathLength="1" stroke-dasharray="${p.toFixed(3)} 1" stroke-linecap="round"/><circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="15" fill="rgba(255,255,255,.22)"/><circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="8" fill="#FFE08A" stroke="#fff" stroke-width="2"/>` : ''}
   <path d="M6 96H314" stroke="rgba(255,255,255,.55)" stroke-width="1.500" stroke-linecap="round"/><circle cx="18" cy="96" r="3.500" fill="#fff"/><circle cx="302" cy="96" r="3.500" fill="#fff"/></svg>

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-day],[data-ticket],[data-taxi],[data-copy],[data-go],[data-place],[data-close],[data-zoom]'); if (!t) return;
  const ds = t.dataset;
  if ('close' in ds) { $('#overlay').innerHTML = ''; return; }
  if ('zoom' in ds) { t.classList.toggle('zoom'); if (t.classList.contains('zoom')) { t.scrollLeft = (t.scrollWidth - t.clientWidth) / 2; } return; }
  if (ds.tab) { tab = ds.tab; if (tab === 'days') { const i = todayIdx(nowMs()); if (i >= 0 && i < D.days.length) openDays.add(D.days[i].d); } render(); if (tab === 'days') { const el = $('.day.today'); if (el) el.scrollIntoView({block: 'start'}); window.scrollBy(0, -12); } return; }
  if (ds.day) { const d = +ds.day; openDays.has(d) ? openDays.delete(d) : openDays.add(d); const sec = t.closest('.day'); sec.classList.toggle('open'); t.setAttribute('aria-expanded', openDays.has(d)); return; }
  if (ds.ticket) return void openTicket(ds.ticket);
  if (ds.taxi) return void openTaxi(ds.taxi);
  if (ds.copy) { (navigator.clipboard ? navigator.clipboard.writeText(ds.copy) : Promise.reject()).then(() => toast('Copied ' + ds.copy), () => toast(ds.copy)); return; }
  if (ds.place) { place = ds.place; render(true); return; }
  if (ds.go) { tab = 'bookings'; render(); const el = $('#bk-' + ds.go); if (el) { el.scrollIntoView({block: 'center'}); el.classList.add('flash'); } }
});

function start() {

  document.addEventListener('visibilitychange', () => { if (!document.hidden && tab === 'today' && !$('#overlay').innerHTML) render(true); });
}
async function boot() {

  $('#lock').classList.remove('hide');

  if (!standalone) $('#inst').classList.remove('hide');
}

  catch (x) { err.textContent = x.message === 'net' ? 'Could not load the trip. Check the connection and try again.' : 'That PIN did not work. Try again.'; $('#pin').value = ''; $('#pin').focus(); }
});
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  let re = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (re || !sessionStorage.getItem('hadsw')) { sessionStorage.setItem('hadsw', '1'); return; } re = true; location.reload(); });
  if (navigator.serviceWorker.controller) sessionStorage.setItem('hadsw', '1');
}
